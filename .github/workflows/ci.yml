name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.lock
      # Hash-pinned install: CI runs exactly the versions the project was verified with.
      - run: pip install --require-hashes -r requirements-dev.lock
      - run: pip install --no-deps -e .
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy src/pwl
      # The coverage gate lives in pyproject.toml (addopts), so local runs and CI agree.
      - run: python -m pytest -q
