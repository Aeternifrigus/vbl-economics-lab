name: refresh-data

# Monthly: pull oil, FX and weather, retrain, nowcast the current quarter, check for drift, commit.
on:
  schedule:
    - cron: "0 5 1 * *"   # 05:00 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.lock
      - run: pip install --require-hashes -r requirements.lock
      - run: pip install --no-deps -e .
      - name: Pull oil, FX and weather snapshots
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python -m pwl ingest
      - name: Validate data and rebuild the quarterly feature table
        run: |
          python -m pwl validate
          python -m pwl features
      - name: Retrain (refuses below 20 quarters, never forced)
        run: python -m pwl train
      - name: Nowcast the current quarter
        # Fails harmlessly in the first days of a quarter, before any oil data exists for it.
        continue-on-error: true
        run: python -m pwl nowcast
      - name: Backtest and rebuild the website data
        run: |
          python -m pwl backtest
          python -m pwl site
      - name: Check for input and performance drift
        run: |
          python -m pwl monitor | tee monitor.txt
          {
            echo "### Model monitor"
            echo '```'
            cat monitor.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if grep -q "status: warn" monitor.txt; then
            echo "::warning title=Model monitor::drift check raised a warning, see the job summary"
          fi
      - name: Commit snapshots, metadata and reports
        run: |
          git config user.name "Aeternifrigus"
          git config user.email "aeternifrigus@proton.me"
          git add data/external reports models/*.json docs/data.js
          git diff --cached --quiet || git commit -m "Refresh data, nowcast, monitor report and website data"
          git push
