name: refresh-data

on:
  schedule:
    - cron: "0 5 1 * *"   # monthly, 05:00 UTC on the 1st
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e .
      - name: Pull oil, FX and weather snapshots
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python -m pwl ingest
      - name: Rebuild the quarterly feature table
        run: python -m pwl features
      - name: Commit snapshots
        run: |
          git config user.name "Aeternifrigus"
          git config user.email "aeternifrigus@proton.me"
          git add data/external
          git diff --cached --quiet || git commit -m "Refresh data snapshots"
          git push
