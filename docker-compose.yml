# One service: run any pwl command in the pinned image.
#   docker compose run --rm pwl validate
#   docker compose run --rm pwl nowcast
# Create a .env file with FRED_API_KEY=... first (see .env.example).
services:
  pwl:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      LOG_FORMAT: console
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./reports:/app/reports
