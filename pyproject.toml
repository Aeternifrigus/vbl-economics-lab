[project]
name = "packaged-water-lab"
version = "0.1.0"
description = "Testing the packaged-water economics narrative against Varun Beverages filings, oil, FX and weather data"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scipy", "scikit-learn"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
