[project]
name = "vbl-economics-lab"
version = "0.1.0"
description = "Testing the packaged-water economics narrative against Varun Beverages filings, oil, FX and weather data"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Aeternifrigus" }]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4",
    "pandas>=3.0",
    "scipy>=1.17",
    "scikit-learn>=1.8",
    "certifi>=2023.7.22",
    "joblib>=1.3.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "rich>=13.6.0",
    "typer>=0.9.0",
]

[project.optional-dependencies]
pdf = ["pdfplumber>=0.10.0"]
ocr = ["pdfplumber>=0.10.0", "pytesseract>=0.3.10"]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pandas-stubs>=2.1.0",
    "pre-commit>=3.6.0",
]

[project.urls]
Repository = "https://github.com/Aeternifrigus/vbl-economics-lab"

[project.scripts]
pwl = "pwl.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=src/pwl --cov-report=term-missing --cov-fail-under=75"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "PIE", "T20", "PL"]
ignore = ["T201", "PLR2004", "PLR0913", "PLR0917"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.11"
warn_return_any = false  # pandas operations are typed Any in many places
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
show_error_codes = true
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["scipy.*", "sklearn.*", "joblib.*", "pdfplumber.*", "certifi.*", "PIL.*", "pytesseract.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/pwl"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
